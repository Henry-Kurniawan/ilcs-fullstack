services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: musicpedia
      POSTGRES_PASSWORD: musicpedia
      POSTGRES_DB: musicpedia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicpedia -d musicpedia"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
